                        fechaCarga: { type: string, nullable: true }
                  pagination:
                    type: object
                    properties: { count: { type: integer }, limit: { type: integer }, next_after_id: { type: integer }, has_more: { type: boolean } }
        "401":
          description: X-API-Key inválida.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "500": { $ref: "#/components/responses/ServerError" }
