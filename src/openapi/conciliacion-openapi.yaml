  /api/movimientos:
    get:
      tags: [movimientos-api]
      summary: Feed unificado de movimientos internos de tesorería, clasificados por categoría de flujo
      servers:
        - url: "http://{host}:{port}"
          variables: { host: { default: 172.16.10.172 }, port: { default: "5158" } }
      security:
        - apiKeyAuth: []
        - {}
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: after_id, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 5000 } }
        - name: categoria
          in: query
          schema: { type: string }
          description: >-
            CSV de categorías a filtrar: CAJA_BANCO, BANCO_BANCO, GASTO, SUCURSAL, REMESA_ME,
            CAJA_CAJA, OTRO (ver descripción de cada una en movimientos.js).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        mcjId: { type: integer }
                        categoria: { type: string, enum: [CAJA_BANCO, BANCO_BANCO, GASTO, SUCURSAL, REMESA_ME, CAJA_CAJA, OTRO] }
                        rubro: { type: integer }
                        banco: { type: string, nullable: true }
                        rubroBanco: { type: integer, nullable: true }
                        direccion: { type: string, enum: [IN, OUT], nullable: true, description: "Solo para categorías bancarias." }
                        mcjES: { type: string, nullable: true, description: "S=salida / E=entrada de efectivo de caja." }
                        monto: { type: number, description: "Siempre en valor absoluto." }
                        fecha: { type: string }
                        glosa: { type: string }
                        sucursal: { type: object }
                        rubroSucursal: { type: integer, nullable: true }
                        cajero: { type: object }
                        estado: { type: object, properties: { actual: { type: string, nullable: true }, anulado: { type: boolean } } }
                        fechaCarga: { type: string, nullable: true }
                  pagination:
                    type: object
                    properties: { count: { type: integer }, next_after_id: { type: integer }, has_more: { type: boolean } }
        "401":
          description: X-API-Key inválida.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/tbk-tesoreria:
    get:
      tags: [movimientos-api]
      summary: Feed de patas TBK del POS (pago con tarjeta), consumido por el cruce Transbank
      servers:
        - url: "http://{host}:{port}"
          variables: { host: { default: 172.16.10.172 }, port: { default: "5158" } }
      security:
        - apiKeyAuth: []
        - {}
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: after_id, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 1000 } }
